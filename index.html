<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Escriptorium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
        }

        /* ── HEADER ── */
        header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 2px solid #e94560;
        }
        header h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
        }
        header p {
            color: #888;
            margin-top: 0.5rem;
            font-size: 1rem;
        }

        /* ── GRID DE LIBROS ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: #1a1a2e;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            border: 1px solid #222;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(233,69,96,0.2);
            border-color: #e94560;
        }

        .card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            display: block;
            background: #222;
        }

        .card-body {
            padding: 1rem;
        }
        .card-body h2 {
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
            line-height: 1.3;
        }
        .card-body p {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 0.7rem;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .btn:hover { background: #c73650; }

        /* ── LECTOR (MODAL) ── */
        .lector {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            flex-direction: column;
        }
        .lector.activo { display: flex; }

        .lector-barra {
            background: #1a1a2e;
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e94560;
            flex-shrink: 0;
        }
        .lector-barra h2 {
            font-size: 1.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }
        .btn-cerrar {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-cerrar:hover { background: #c73650; }

        .lector iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: #fff;
        }

        /* ── VACÍO ── */
        .vacio {
            text-align: center;
            padding: 4rem 1rem;
            color: #555;
            font-size: 1.1rem;
            grid-column: 1 / -1;
        }

        /* ── FOOTER ── */
        footer {
            text-align: center;
            padding: 2rem;
            color: #444;
            font-size: 0.8rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 El Escriptorium</h1>
        <p>Tu biblioteca digital</p>
    </header>

    <div class="grid" id="grid"></div>

    <!-- LECTOR DE PDF -->
    <div class="lector" id="lector">
        <div class="lector-barra">
            <h2 id="lector-titulo">Leyendo...</h2>
            <button class="btn-cerrar" onclick="cerrarLector()">✕ Cerrar</button>
        </div>
        <iframe id="visor" src=""></iframe>
    </div>

    <footer>El Escriptorium &copy; 2026</footer>

    <script>
    // ╔══════════════════════════════════════════════════════════╗
    // ║  AGREGA TUS LIBROS AQUÍ                                 ║
    // ║  Copia el bloque { ... } para cada libro nuevo          ║
    // ╚══════════════════════════════════════════════════════════╝

    const libros = [

        {
            titulo: "El Heredero",
            autor: "Tu Nombre",
            portada: "portadas/heredero.jpg",
            pdf: "pdfs/el-heredero.pdf"
        },

        {
            titulo: "Segundo Libro",
            autor: "Otro Autor",
            portada: "portadas/libro2.jpg",
            pdf: "pdfs/libro2.pdf"
        }

        // ← AGREGA MÁS LIBROS AQUÍ (copia el bloque de arriba)

    ];

    // ── No toques nada de aquí abajo ──

    const grid = document.getElementById("grid");

    if (libros.length === 0) {
        grid.innerHTML = '<div class="vacio">Aún no hay libros publicados.</div>';
    } else {
        grid.innerHTML = libros.map((l, i) => `
            <div class="card" onclick="abrirLibro(${i})">
                <img src="${l.portada}" alt="${l.titulo}"
                     onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22450%22><rect fill=%22%23222%22 width=%22300%22 height=%22450%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23555%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2220%22>Sin portada</text></svg>'">
                <div class="card-body">
                    <h2>${l.titulo}</h2>
                    <p>${l.autor}</p>
                    <span class="btn">📖 Leer ahora</span>
                </div>
            </div>
        `).join("");
    }

    function abrirLibro(i) {
        document.getElementById("lector-titulo").textContent = libros[i].titulo;
        document.getElementById("visor").src = libros[i].pdf;
        document.getElementById("lector").classList.add("activo");
        document.body.style.overflow = "hidden";
    }

    function cerrarLector() {
        document.getElementById("lector").classList.remove("activo");
        document.getElementById("visor").src = "";
        document.body.style.overflow = "";
    }

    document.addEventListener("keydown", e => {
        if (e.key === "Escape") cerrarLector();
    });
    </script>

</body>
</html>
